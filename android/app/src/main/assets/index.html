<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>芯奏界</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101923;color:#e8f0f7;font:15px system-ui}header{padding:18px;background:#182839;}h1{font-size:23px;margin:0 0 8px}small{color:#a5bbce}button,select,input{font:inherit;border-radius:9px;border:1px solid #39536b;padding:10px;background:#21374b;color:inherit}button{touch-action:manipulation;cursor:pointer}button:active{background:#287f92}button.primary{background:#197e80}.danger{background:#993f4e}nav{display:flex;gap:7px;overflow:auto;padding:12px;background:#101923;z-index:1}nav button{white-space:nowrap}main{max-width:1100px;margin:auto;padding:14px}section{background:#182839;padding:16px;border-radius:13px;margin-bottom:15px}h2{font-size:19px;margin-top:0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px;margin:10px 0}input[type=range]{width:100%;padding:0}.key{min-height:85px;background:#e7eef4;color:#17283a}.pad{min-height:65px}canvas{display:block;width:100%;height:180px;background:#0c141e;touch-action:none;border:1px solid #3b5c78;border-radius:8px}textarea{width:100%;height:130px;background:#0b1520;color:#dce8f4;border:1px solid #36516b;border-radius:8px;padding:10px}.notice{color:#a5bbce;line-height:1.65}#log{font-size:12px;max-height:120px;overflow:auto;white-space:pre-wrap}#state{font-size:13px;color:#83dfce}label{user-select:none}.step{padding:5px;min-height:34px;border-radius:3px}.on{background:#24a29a}.steps{display:grid;grid-template-columns:repeat(16,minmax(20px,1fr));gap:3px;margin:6px 0}.foot{font-size:12px;color:#91aabf;margin:15px}a{color:#89e0d5}#shell{position:sticky;top:0;z-index:2;background:#101923}</style>
<div id="shell"><header><h1>芯奏界 <small>FPGA移动控制台</small></h1><div class="row"><button class="primary" onclick="Mobile.scan()">扫描 / 连接BLE</button><button onclick="Mobile.disconnect()">断开</button><button class="danger" onclick="stopAll()">停止演奏</button></div><p id="state">离线编辑；声音由FPGA生成</p><small id="queueState">待发送包 0</small></header><nav id="nav"></nav></div><main id="main"></main><section><small>通信与设备回执（BLE写成功不等于音频执行成功）</small><div id="log"></div></section>
