plugins { id 'com.android.application' }
android {
    namespace 'cn.fpga.controller'
    compileSdk 35
    signingConfigs {
        debug {
            // Original developer signing key is intentionally absent from public source.
            // Without it, Android Gradle Plugin uses this computer's default debug key.
            if (file('../keystore/debug.keystore').exists()) {
                storeFile file('../keystore/debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
            }
        }
    }
    defaultConfig { applicationId 'cn.fpga.controller'; minSdk 26; targetSdk 35; versionCode 5; versionName '0.5-midi-import' }
}
tasks.withType(JavaCompile).configureEach { options.encoding = "UTF-8" }
